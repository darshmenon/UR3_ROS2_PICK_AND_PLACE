# MoveIt controller-manager config for dual_ur.srdf.xacro's left_arm/right_arm
# groups. Mirrors moveit_controllers.yaml but maps onto the left_/right_
# prefixed controllers declared in dual_ros2_controllers.yaml.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_monitoring: false
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 15.0

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - left_gripper_controller
    - right_gripper_controller

  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true

  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true

  left_gripper_controller:
    type: GripperCommand
    joints:
      - left_finger_joint
    action_ns: gripper_cmd
    default: true

  right_gripper_controller:
    type: GripperCommand
    joints:
      - right_finger_joint
    action_ns: gripper_cmd
    default: true
