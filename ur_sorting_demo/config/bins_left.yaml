# Bin positions for the LEFT arm, in left_base_link.
#
# MotionExecutor plans in {prefix}base_link, so these are the reachable
# single-arm bins (sorting_node.DEFAULT_BINS), not those numbers shifted by
# the arm's world offset. The old blue bin at x=0.50 is outside UR3 reach.
/**:
  ros__parameters:
    bins.red.x: 0.06
    bins.red.y: 0.38
    bins.red.z: 0.08
    bins.green.x: 0.20
    bins.green.y: 0.28
    bins.green.z: 0.08
    bins.blue.x: 0.34
    bins.blue.y: 0.28
    bins.blue.z: 0.08
    bins.yellow.x: 0.15
    bins.yellow.y: -0.30
    bins.yellow.z: 0.08
    bins.orange.x: 0.35
    bins.orange.y: -0.30
    bins.orange.z: 0.08
